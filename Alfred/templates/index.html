<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfred — Your AI Butler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #0a0a0a; color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
            background-size: 56px 56px;
            -webkit-mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 85%);
            mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 85%);
        }
        body::after {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 80% 50% at 50% -5%, rgba(255,255,255,0.05), transparent 60%);
        }

        /* Top nav pill */
        .top-bar { position: fixed; top: 18px; left: 0; right: 0; display: flex; justify-content: center; z-index: 100; }
        .nav-container {
            display: flex; align-items: center; gap: 20px;
            background: rgba(18,18,18,0.72);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px; padding: 11px 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.45);
        }
        .model-selector { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 8px; }
        .model-name { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
        .session-indicator { display: flex; align-items: center; gap: 10px; }
        .session-text { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: rgba(255,255,255,0.92); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff453a; box-shadow: 0 0 8px rgba(255,69,58,0.8); }

        /* Main area */
        .main-content {
            position: relative; z-index: 1;
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 110px 24px 170px; overflow-y: auto; width: 100%;
        }
        .main-content.chatting { justify-content: flex-start; }
        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .wave-line { width: min(460px, 70vw); height: auto; margin-bottom: 56px; overflow: hidden; }
        .wave-line path { animation: drift 5s linear infinite; }
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-115px); } }
        .greeting {
            font-size: clamp(40px, 6.5vw, 72px);
            font-weight: 600; line-height: 1.15; margin-bottom: 28px;
            background: linear-gradient(180deg, #9c9c9c 0%, #5f5f5f 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .status-message { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.42); letter-spacing: 0.04em; }

        /* Messages */
        .chat-messages { display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; }
        .msg {
            max-width: 78%; padding: 12px 18px; border-radius: 16px; margin-bottom: 12px;
            font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: break-word;
        }
        .msg.user { align-self: flex-end; background: rgba(109,74,255,0.16); border: 1px solid rgba(109,74,255,0.28); }
        .msg.assistant { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
        .msg.error { align-self: flex-start; background: rgba(255,69,58,0.08); border: 1px solid rgba(255,69,58,0.25); color: #ffb4ae; }
        .msg.sources {
            background: none; border: none; padding: 0 0 4px; max-width: 90%;
            font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.4);
        }
        .msg.thinking { display: flex; gap: 5px; padding: 16px 18px; }
        .thinking span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); animation: blink 1.2s infinite; }
        .thinking span:nth-child(2) { animation-delay: 0.2s; }
        .thinking span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

        /* Input bar */
        .input-container { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; z-index: 100; padding: 0 20px; }
        .input-wrapper {
            display: flex; align-items: center; gap: 10px;
            width: 100%; max-width: 880px;
            background: rgba(20,20,20,0.82);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 30px; padding: 10px 12px 10px 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .attach-btn { background: none; border: none; color: rgba(255,255,255,0.55); cursor: pointer; padding: 8px; border-radius: 10px; display: flex; }
        .attach-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .chat-input {
            flex: 1; min-width: 0; background: none; border: none; outline: none;
            color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; padding: 8px 4px;
        }
        .chat-input::placeholder { color: rgba(255,255,255,0.32); }
        .quality-pill {
            display: flex; align-items: center; gap: 7px; flex-shrink: 0;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
            border-radius: 999px; padding: 8px 14px; color: rgba(255,255,255,0.75); cursor: pointer;
        }
        .quality-pill select {
            appearance: none; -webkit-appearance: none; background: transparent; border: none; outline: none;
            color: rgba(255,255,255,0.85); font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer;
        }
        .quality-pill select option { background: #161616; color: #fff; }
        .mic-btn {
            width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; flex-shrink: 0;
            background: #fff; display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s ease;
        }
        .mic-btn:hover { transform: scale(1.06); }
        .mic-btn svg { fill: #0a0a0a; }

        /* Stats bar */
        .stats-bar {
            position: fixed; bottom: 8px; left: 0; right: 0; z-index: 100; pointer-events: none;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: rgba(255,255,255,0.32);
        }
        .stats-progress { width: 90px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
        #statsFill { height: 100%; width: 0%; background: rgba(255,255,255,0.45); transition: width 0.3s ease; }

        @media (max-width: 768px) {
            .nav-container { gap: 12px; padding: 9px 14px; }
            .msg { max-width: 92%; }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <div class="top-bar">
        <div class="nav-container">
            <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
                <path d="M1 6 Q 4 1.5, 7 6 T 13 6 T 19 6 T 25 6" stroke="rgba(255,255,255,0.9)" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <div class="model-selector">
                <span class="model-name">Alfred</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="rgba(255,255,255,0.55)"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div class="session-indicator">
                <span class="session-text" id="sessionText">the manor</span>
                <div class="status-dot"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="hero" id="hero">
            <svg class="wave-line" viewBox="0 0 460 40" fill="none">
                <path d="M0 20 Q 28.75 3, 57.5 20 T 115 20 T 172.5 20 T 230 20 T 287.5 20 T 345 20 T 402.5 20 T 460 20 T 517.5 20 T 575 20"
                      stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <h1 class="greeting" id="greeting">At your service, sir</h1>
            <p class="status-message" id="statusMessage">// Always at your service</p>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
    </main>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-wrapper">
            <!-- + button = hand documents to the butler -->
            <button class="attach-btn" onclick="handleAttach()" title="Give Alfred a document — PDF / TXT / MD">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            <input type="text" class="chat-input" id="messageInput" placeholder="// Your instructions, sir..." autocomplete="off">
            <div class="quality-pill">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
                <select id="qualitySelect">
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high" selected>high</option>
                </select>
            </div>
            <button class="mic-btn" onclick="handleMic()" title="Speak to Alfred">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c1.39-.49 4-3.39 4-6.92h-2z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <span id="tokenStats">0 tok input · 0 tok thread · 0% of 300K cap</span>
        <div class="stats-progress"><div id="statsFill"></div></div>
    </div>

    <!-- Hidden file picker for RAG uploads -->
    <input type="file" id="fileInput" accept=".pdf,.txt,.md" style="display:none">

    <script>
        const messageInput = document.getElementById('messageInput');
        const qualitySelect = document.getElementById('qualitySelect');
        const tokenStats = document.getElementById('tokenStats');
        const statsFill = document.getElementById('statsFill');
        const mainContent = document.getElementById('mainContent');
        const chatMessages = document.getElementById('chatMessages');
        const hero = document.getElementById('hero');
        const sessionText = document.getElementById('sessionText');
        const fileInput = document.getElementById('fileInput');

        let inputTokens = 0;
        let threadTokens = 0;
        const tokenCap = 300000;

        // ONE session id, reused for the whole conversation
        const sessionId = 'session-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);

        // ---------- Alfred's random lines ----------
        const greetingTemplates = [
            'At your service, {name}',
            'How may I be of assistance, {name}?',
            'Punctual as ever, {name}',
            'Yes, {name}?',
            'I live to serve, {name}',
            'Another fine day for problem-solving, {name}',
            'Alfred reporting for duty',
            'Tea is brewed. Questions are welcome.',
            'The manor is quiet. The AI is listening.'
        ];
        const statusLines = [
            '// Always at your service',
            '// Awaiting your instructions, sir',
            '// The kettle is on',
            '// Polished and ready',
            '// No errand too trivial',
            '// Duty calls, and I answer',
            '// Manners maketh machine'
        ];
        const uploadLines = [
            '⏳ Indexing', '⏳ Filing into the archive',
            '⏳ Studying the documents', '⏳ Committing to memory'
        ];
        const indexedLines = ['📚 Indexed', '📚 Filed away', '📚 Committed to memory'];

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        // Robust fetch: never crashes on HTML error pages
        async function fetchJSON(url, options) {
            const r = await fetch(url, options);
            let data = {};
            try { data = await r.json(); }
            catch (e) { data = { error: 'Server error ' + r.status }; }
            return data;
        }

        // ---------- Greeting adapts to the name Alfred remembers ----------
        (async function initGreeting() {
            let name = 'sir';
            try {
                const mem = await fetchJSON('/memory');
                if (mem.name) name = 'Master ' + mem.name;
            } catch (e) { /* Flask not up yet — fall back to 'sir' */ }
            document.getElementById('greeting').textContent =
                pick(greetingTemplates).replaceAll('{name}', name);
            document.getElementById('statusMessage').textContent = pick(statusLines);
        })();

        // ---------- Chat ----------
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && messageInput.value.trim()) {
                sendMessage(messageInput.value.trim());
                messageInput.value = '';
            }
        });

        function sendMessage(message) {
            hideHero();
            renderMessage('user', message);
            inputTokens += Math.ceil(message.length / 4);
            updateStats();

            const thinking = renderThinking();

            fetchJSON('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    quality: qualitySelect.value,
                    session_id: sessionId
                })
            })
            .then(data => {
                thinking.remove();
                if (data.error) {
                    renderMessage('error', '⚠️ ' + data.error);
                    return;
                }
                const reply = data.reply || '⚠️ Empty response from server';
                renderMessage(reply.startsWith('⚠️') ? 'error' : 'assistant', reply);
                threadTokens += Math.ceil(reply.length / 4);
                updateStats();
                if (data.sources && data.sources.length) renderSources(data.sources);
            })
            .catch(err => {
                thinking.remove();
                renderMessage('error', '⚠️ Failed to send: ' + err.message);
            });
        }

        function hideHero() {
            hero.style.display = 'none';
            mainContent.classList.add('chatting');
        }

        function renderMessage(role, text) {
            const el = document.createElement('div');
            el.className = 'msg ' + role;
            el.textContent = text;
            chatMessages.appendChild(el);
            mainContent.scrollTop = mainContent.scrollHeight;
            return el;
        }

        function renderThinking() {
            const el = document.createElement('div');
            el.className = 'msg thinking';
            el.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(el);
            mainContent.scrollTop = mainContent.scrollHeight;
            return el;
        }

        function renderSources(sources) {
            const el = document.createElement('div');
            el.className = 'msg sources';
            el.textContent = '📎 ' + sources.map(s =>
                s.source + ' · chunk ' + s.chunk + ' · ' + Math.round(s.score * 100) + '% match'
            ).join('  |  ');
            chatMessages.appendChild(el);
            mainContent.scrollTop = mainContent.scrollHeight;
        }

        // ---------- RAG: give Alfred documents via the + button ----------
        function handleAttach() { fileInput.click(); }

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            hideHero();
            const status = renderMessage('assistant', pick(uploadLines) + ' "' + file.name + '"...');
            const fd = new FormData();
            fd.append('file', file);
            fetchJSON('/upload', { method: 'POST', body: fd })
                .then(d => {
                    if (d.error) status.textContent = '⚠️ ' + d.error;
                    else status.textContent = pick(indexedLines) + ' "' + d.file + '" — ' + d.chunks + ' chunks. Ask me about it, sir!';
                    refreshDocCount();
                })
                .catch(() => { status.textContent = '⚠️ Upload failed — is Alfred (Flask) running?'; });
            fileInput.value = '';
        });

        function refreshDocCount() {
            Promise.all([
                fetchJSON('/documents'),
                fetchJSON('/memory')
            ])
            .then(([docs, mem]) => {
                const n = (docs.documents || []).length;
                if (n) sessionText.textContent = n + ' doc' + (n > 1 ? 's' : '') + ' in the archive';
                else sessionText.textContent = mem.name ? 'Master ' + mem.name : 'the manor';
            })
            .catch(() => {});
        }
        refreshDocCount();

        // ---------- Stats ----------
        function updateStats() {
            const pct = ((inputTokens + threadTokens) / tokenCap * 100).toFixed(1);
            tokenStats.textContent = inputTokens + ' tok input · ' + threadTokens + ' tok thread · ' + pct + '% of 300K cap';
            statsFill.style.width = Math.min(pct, 100) + '%';
        }

        // ---------- Mic ----------
        function handleMic() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SR();
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    messageInput.value = transcript;
                    sendMessage(transcript);
                    messageInput.value = '';
                };
                recognition.onerror = (event) => console.error('Speech error:', event.error);
                recognition.start();
            } else {
                renderMessage('error', '⚠️ Speech recognition is not supported in this browser');
            }
        }
    </script>
</body>
</html>
